[package]
name = "pai-core"
version = "0.1.0"
edition = "2021"
description = "Personal Agentic AI - Stateless Core Engine (Phase 2 VS2)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Power",
] }

[dev-dependencies]
serde_json = "1.0"

