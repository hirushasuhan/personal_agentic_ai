name: Windows CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-research:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: research
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install cryptography

      - name: Run Test Suite (170 unit tests)
        working-directory: research
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Telemetry
        working-directory: research
        run: |
          python main.py --telemetry

      - name: Verify Stateless Purge Benchmark
        working-directory: research
        run: |
          python main.py --benchmark --iterations 8

      - name: Verify Ingestion & Raw Transport (live network - informational, must not block merges)
        continue-on-error: true
        working-directory: research
        run: |
          python main.py --ask "Summarize" --topic "Rust (programming language)" --transport raw

  rust-core:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python for conformance drift check
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: research
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install cryptography

      - name: Conformance Drift Check
        run: |
          python research/conformance.py
          git diff --exit-code research/conformance

      - name: Rust Format Check
        working-directory: core
        run: |
          cargo fmt --all --check

      - name: Rust Clippy
        working-directory: core
        run: |
          cargo clippy --all-targets -- -D warnings

      - name: Rust Test Suite
        working-directory: core
        run: |
          cargo test

      - name: Verify Unsafe Isolation (win32.rs only per ADR-009)
        run: |
          $unsafe_matches = Get-ChildItem -Path core/src -Filter "*.rs" | Where-Object { $_.Name -ne "win32.rs" } | Select-String -Pattern "unsafe\s*(\{|fn|trait|impl)"
          if ($unsafe_matches) {
            Write-Error "CRITICAL: Unsafe code detected outside win32.rs: $unsafe_matches"
            exit 1
          }

      - name: Conformance Vectors CLI Runner
        working-directory: core
        run: |
          cargo run -- --conformance ../research/conformance

      - name: Differential Fuzz Verification (10,000 cases)
        working-directory: research
        run: |
          python conformance.py --fuzz 10000 --seed 42

      - name: Rust Win32 Telemetry Check
        working-directory: core
        run: |
          cargo run -- --telemetry
          cargo run -- --telemetry --json

      - name: Telemetry Parity Check (Python vs Rust ±5% per ADR-009)
        working-directory: research
        run: |
          python -m unittest tests/test_telemetry_parity.py

      - name: Milestone M1 Unit Tests (Track L / ADR-008)
        working-directory: research
        run: |
          python -m unittest tests/test_m1_code.py

  linux-portability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: research
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography

      - name: Install bubblewrap for M2 Linux sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi

      - name: Verify Bubblewrap Functional Check on Linux (Fail-closed gate)
        working-directory: research
        run: |
          python -c "
          import shutil, sys
          from sandbox_linux import is_bwrap_available, is_bwrap_functional, probe_linux_boundary
          if not is_bwrap_available():
              sys.exit('FATAL: bwrap executable not found in PATH on Linux CI')
          if not is_bwrap_functional():
              sys.exit('FATAL: is_bwrap_functional() returned False on Linux CI (unprivileged namespaces restricted or mount resolution failed)')
          ok, msg = probe_linux_boundary()
          if not ok:
              sys.exit(f'FATAL: probe_linux_boundary() failed on Linux CI: {msg}')
          print('Bubblewrap sandbox and behavioural probe verified successfully on Linux CI:', msg)
          "

      - name: Run Linux Sandbox Adversarial Test Suite (Assert Zero Skips)
        working-directory: research
        run: |
          python -c "
          import unittest, sys
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName('tests.test_sandbox_linux')
          runner = unittest.TextTestRunner(verbosity=2)
          result = runner.run(suite)
          if not result.wasSuccessful():
              sys.exit(f'FATAL: Linux sandbox tests failed (failures={len(result.failures)}, errors={len(result.errors)})')
          if result.testsRun == 0:
              sys.exit('FATAL: Zero Linux sandbox tests were executed!')
          if len(result.skipped) > 0:
              sys.exit(f'FATAL: {len(result.skipped)} Linux sandbox tests were skipped on Linux CI! Zero skips allowed on Linux host.')
          print(f'All {result.testsRun} Linux sandbox tests ran and passed with ZERO skips.')
          "

      - name: Execute M2a Adversarial Containment Matrix on Linux CI
        working-directory: research
        run: |
          python run_m2a_matrix.py

      - name: Upload Linux M2a Sandbox Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-m2a-sandbox-evidence
          path: |
            docs/evidence/m2a_sandbox_results.json
            docs/evidence/m2a_sandbox_raw.log
          if-no-files-found: error

      - name: Run Full Test Suite on Linux (Procfs Telemetry & Bubblewrap Sandbox)
        working-directory: research
        run: |
          python -m unittest discover -s tests -v

      - name: Test PAI CLI Doctor on Linux
        working-directory: research
        run: |
          python pai.py doctor
          python pai.py doctor --json

      - name: Test PAI CLI Models Catalog on Linux
        working-directory: research
        run: |
          python pai.py models list
          python pai.py models list --json

      - name: Test PAI CLI Route on Linux
        working-directory: research
        run: |
          python pai.py route code --explain-route
          python pai.py route chat --explain-route

